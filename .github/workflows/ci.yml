name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest "rich>=13" "rich-argparse>=1.7"
      - run: python -m pytest python/tests -q
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - run: git diff --exit-code -- src/styles/tokens.css
      - run: npm test
      - run: npm run build
      - name: Check standalone archive
        run: |
          mkdir -p dist/package
          npm pack --pack-destination dist/package
          archive=$(find dist/package -name '*.tgz' -print -quit)
          node scripts/verify-package.mjs "$archive"
