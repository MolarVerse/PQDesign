name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "rich>=13" "rich-argparse>=1.7"
      - run: python -m pytest python/tests -q
      - run: npm ci
      - run: npm run tokens
      - run: git diff --exit-code -- src/styles/tokens.css
      - run: npm test
      - run: npm run build
      - name: Pack and verify
        run: |
          mkdir -p dist/package
          npm pack --pack-destination dist/package
          archive=$(find dist/package -name '*.tgz' -print -quit)
          node scripts/verify-package.mjs "$archive"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist/package
          sha256sum ./*.tgz > SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tgz ./SHA256SUMS \
            --title "PQ design ${RELEASE_TAG#v}" \
            --notes "Shared flat-mono tokens, React controls and Python terminal presentation for the PQ applications." \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
