<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">PQDesign package dependencies</title>
  <desc id="desc">The token generator reads tokens.json and writes tokens.css. Documentation and existing apps can consume tokens.css directly. styles.css includes the tokens and base and component rules. React controls and styles are imported separately into an application, which owns layout and state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f62fe"/>
    </marker>
  </defs>
  <rect width="880" height="300" fill="#ffffff"/>
  <g fill="none" stroke="#0f62fe" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 180 54 H 226"/>
    <path d="M 416 54 H 470"/>
    <path d="M 640 54 H 696"/>
    <path d="M 555 80 V 118"/>
    <path d="M 640 150 H 674 V 190 H 696"/>
    <path d="M 640 246 H 674 V 208 H 696"/>
  </g>
  <g fill="#f4f4f4" stroke="#8d8d8d">
    <rect x="20" y="28" width="160" height="52"/>
    <rect x="230" y="28" width="186" height="52"/>
    <rect x="474" y="28" width="166" height="52"/>
    <rect x="700" y="20" width="160" height="68"/>
    <rect x="474" y="122" width="166" height="56"/>
    <rect x="474" y="218" width="166" height="56"/>
    <rect x="700" y="166" width="160" height="66"/>
  </g>
  <g fill="#161616" font-family="IBM Plex Mono,ui-monospace,monospace" font-size="13" text-anchor="middle">
    <text x="100" y="59">tokens.json</text>
    <text x="323" y="59">build-tokens.mjs</text>
    <text x="557" y="59">tokens.css</text>
    <text x="780" y="48">App or docs CSS</text>
    <text x="557" y="145">styles.css</text>
    <text x="557" y="252">React controls</text>
    <text x="780" y="194">Application UI</text>
  </g>
  <g fill="#6f6f6f" font-family="IBM Plex Mono,ui-monospace,monospace" font-size="11" text-anchor="middle">
    <text x="780" y="69">theme mapping</text>
    <text x="557" y="165">base + component rules</text>
    <text x="780" y="216">layout + state</text>
  </g>
</svg>
